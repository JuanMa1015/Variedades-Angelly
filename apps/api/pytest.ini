[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_functions = test_*
pythonpath = .
markers =
    unit: pruebas unitarias de dominio
    integration: pruebas de integracion
    bdd: escenarios BDD ejecutados con Behave
    sin_turno: la prueba maneja la apertura de caja por su cuenta (no arranca con un turno abierto)
addopts = -ra
